<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Building Materials & Construction Supply</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" type="image/jpeg" href="assets/images/logo.jpg">
</head>
<body class="bg-background min-vh-100 d-flex flex-column">
<div class="flex-grow-1 d-flex align-items-center justify-content-center py-5 position-relative">
    <div class="blueprint-bg position-absolute top-0 start-0 w-100 h-100 opacity-50 z-0"></div>
    
    <!-- Page Toggles (Top Right) -->
    <div class="position-absolute top-0 end-0 p-4 z-3">
      <div class="d-flex gap-3">
        <button class="action-icon bg-white shadow-sm border" id="theme-toggle-mobile"><i data-lucide="moon" id="theme-icon-mobile"></i></button>
        <button class="action-icon bg-white shadow-sm border" id="dir-toggle-mobile"><i data-lucide="arrow-left-right"></i></button>
      </div>
    </div>
    
    <div class="container position-relative z-1">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
          
          <div class="premium-card bg-white p-4 p-md-5 w-100">
            <!-- Page Logo inside card -->
            <div class="text-center mb-4 pb-2 border-bottom">
              <a class="navbar-brand fs-3 m-0 d-inline-flex align-items-center gap-2 text-decoration-none" href="index.html">
                <i data-lucide="hard-hat" class="text-primary-custom"></i>
                <span class="text-dark fw-bold">Industrial<span class="text-primary-custom">Supply</span></span>
              </a>
            </div>

            <div class="text-center mb-4 mt-3">
              <h3 class="fw-bold text-dark">Welcome Back</h3>
              <p class="text-muted small">Sign in to your procurement dashboard</p>
            </div>
            
            <form>
              <div class="mb-3">
                <label class="form-label fw-bold small text-dark">Email Address</label>
                <div class="position-relative">
                  <i data-lucide="mail" class="position-absolute top-50 translate-middle-y ms-3 text-muted" style="width:16px;"></i>
                  <input type="email" class="form-control form-control-custom ps-5 text-dark bg-background" placeholder="contractor@build.com">
                </div>
              </div>
              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label class="form-label fw-bold small text-dark mb-0">Password</label>
                  <a href="#" class="text-primary-custom text-decoration-none small fw-bold">Forgot Password?</a>
                </div>
                <div class="position-relative">
                  <i data-lucide="lock" class="position-absolute top-50 translate-middle-y ms-3 text-muted" style="width:16px;"></i>
                  <input type="password" id="loginPassword" class="form-control form-control-custom ps-5 pe-5 text-dark bg-background" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢">
                  <button type="button" class="btn border-0 position-absolute top-50 end-0 translate-middle-y text-muted" onclick="const p=document.getElementById('loginPassword'); const i=this.querySelector('i'); if(p.type==='password'){p.type='text'; i.setAttribute('data-lucide', 'eye-off');}else{p.type='password'; i.setAttribute('data-lucide', 'eye');} lucide.createIcons();">
                    <i data-lucide="eye" style="width:16px;"></i>
                  </button>
                </div>
              </div>
              <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input border-secondary" id="rememberMe">
                <label class="form-check-label text-muted small" for="rememberMe">Remember me for 30 days</label>
              </div>
              
              <div class="d-grid gap-3 mb-4">
                <button type="submit" class="btn-primary-custom w-100 justify-content-center" onclick="event.preventDefault(); window.location.href='index.html';">Login to Dashboard</button>
              </div>

              <div class="position-relative text-center my-4">
                <hr class="text-muted opacity-25">
                <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-muted">Or continue with</span>
              </div>

              <div class="d-flex gap-3 mb-4">
                <button type="button" class="btn btn-outline-custom w-50 justify-content-center text-dark bg-white">
                  <img src="assets/images/social/google.svg" alt="Google" style="width:18px; height:18px; display:block;"> Google
                </button>
                <button type="button" class="btn btn-outline-custom w-50 justify-content-center text-dark bg-white">
                  <img src="assets/images/social/apple.svg" alt="Apple" style="width:18px; height:18px; display:block;"> Apple
                </button>
              </div>
              
              <div class="text-center text-muted small border-top pt-3">
                Don't have a contractor account? <a href="register.html" class="text-primary-custom text-decoration-none fw-bold">Register here</a>
              </div>
            </form>
          </div>
          
        </div>
      </div>
    </div>
  </div>
<script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
